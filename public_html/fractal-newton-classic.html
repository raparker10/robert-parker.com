<h1>Newton Fractal</h1>
<p>Newton Fractals can be made with a wide variety of equations. The following formula is a generalized version of the "classic" one that can use any power, along with perturbations of (a+bi) and (c+di):</p>
<math display="block">
        <mrow>
            <msub><mrow><mi>Z</mi></mrow><mrow><mi>n</mi><mo>+</mo><mtext>1</mtext></mrow></msub> 
            <mo>=</mo> 
            <mo>(</mo><mi>c</mi><mo>+</mo><mi>d<i>i</i></mi><mo>)</mo>
            <mfrac>
                <mrow><msubsup><mi>Z</mi><mi>n</mi><mrow><mo>(</mo><mi>a</mi><mo>+</mo><mi>b<i>i</i></mi><mo>)</mo></mrow></msubsup><mo>-</mo><mn>1</mn></mrow>
                <mrow><mo>(</mo><mi>a</mi><mo>+</mo><mi>b<i>i</i></mi><mo>)</mo><msubsup><mi>Z</mi><mi>n</mi><mrow><mo>(</mo><mi>a</mi><mo>+</mo><mi>b<i>i</i></mi><mo>)</mo><mo>-</mo><mn>1</mn></mrow></msubsup></mrow>
            </mfrac>
        </mrow>
</math>
