<h1>Lemon</h1>
<p>The Lemon fractal is generated with the following equation:</p>

<math display="block">
    <mrow>
        <msub><mrow><mi>Z</mi></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub> 
        <mo>=</mo>
        <msub><mi>Z</mi><mn>0</mn></msub> 
        <mfrac>
        <mrow>
            <mo>(</mo><msubsup><mi>Z</mi><mi>n</mi><mrow><mo>(</mo><mi>a</mi><mo>+</mo><mi>bi</mi><mo>)</mo></mrow></msubsup><mo>+</mo><mi>c</mi><mo>+</mo><mi>di</mi><mo>)</mo>
            <mo>(</mo><msubsup><mi>Z</mi><mi>n</mi><mrow><mo>(</mo><mi>a</mi><mo>+</mo><mi>bi</mi><mo>)</mo></mrow></msubsup><mo>+</mo><mi>c</mi><mo>+</mo><mi>di</mi><mo>+</mo><mn>1</mn><mo>)</mo>
        </mrow>
            <mrow>
                <msup><mrow><mo>(</mo><msubsup><mi>Z</mi><mi>n</mi><mrow><mo>(</mo><mi>a</mi><mo>+</mo><mi>bi</mi><mo>)</mo></mrow></msubsup><mo>+</mo><mi>c</mi><mo>+</mo><mi>di</mi><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn>
            </mrow>
        </mfrac>
    </mrow>
</math>
<p>It is a generalization of a formula on <a href="https://paulbourke.net/fractals/lemon/">Paul Bourke's website</a> that allows non-integer complex exponents.</p>
