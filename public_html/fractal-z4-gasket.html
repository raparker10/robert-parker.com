<h1><math><msup><mi>Z</mi><mn>4</mn></msup></math> Gasket</h1>
<p>The <math><msup><mi>Z</mi><mn>4</mn></msup></math> Gasket fractal is generated with the following equation:</p>
<math display="block">
        <msub><mrow><mi>Z</mi></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub> 
        <mo>=</mo>
        <mfrac>
            <mrow>
                <msubsup><mi>Z</mi><mi>n</mi><mn>4</mn></msubsup>
                <mo>+</mo>
                <msubsup><mi>Z</mi><mi>n</mi><mn>2</mn></msubsup>
                <mo>+</mo>
                <mn>1</mn>
            </mrow>
            <mrow>
                <msubsup><mi>Z</mi><mi>n</mi><mn>4</mn></msubsup>
                <mo>-</mo>
                <msubsup><mi>Z</mi><mi>n</mi><mn>2</mn></msubsup>
                <mo>+</mo>
                <mn>1</mn>
            </mrow>
        </mfrac>
        <mo>+</mo>
        <mi>a</mi>
        <mo>+</mo>
        <mi>b</mi>
        <mi>i</mi>
</math>
