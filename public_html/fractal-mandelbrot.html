<h1>Mandelbrot Set</h1>
<p>The Mandelbrot Set is the set of all connected Julia Sets.  It is generated using the following equation:</p>
<math display="block">
    <mrow>
        <msub>
            <mrow><mi>Z</mi></mrow>
            <mrow><mi>n</mi><mo>+</mo><mtext>1</mtext></mrow>
        </msub> 
        <mo>=</mo>
        <msubsup>
            <mrow><mi>Z</mi></mrow>
            <mi>n</mi>
            <mn>2</mn>
        </msubsup> 
        <mo>+</mo><mi>C</mi>
    </mrow>
</math>

<div class="fractal-box">
