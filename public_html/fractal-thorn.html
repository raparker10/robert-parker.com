<h1>Thorn</h1>
<p>The Thorn fractal is generated with the following equation:</p>
<math display="block">
    <mrow>
        <msub><mrow><mi>X</mi></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub> 
        <mo>=</mo>
        <mfrac>
            <msub><mi>X</mi><mi>n</mi></msub> 
            <mrow><mi>cos</mi><mo>(</mo><msub><mi>Y</mi><mi>n</mi></msub><mo>)</mo> </mrow>
        </mfrac>
        <mo>+</mo>
        <msub><mi>X</mi><mi>n</mi></msub> 
    </mrow>
</math>
<math display="block">
    <mrow>
        <msub><mrow><mi>Y</mi></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub> 
        <mo>=</mo>
        <mfrac>
            <msub><mi>Y</mi><mi>n</mi></msub> 
            <mrow><mi>sin</mi><mo>(</mo><msub><mi>X</mi><mi>n</mi></msub><mo>)</mo> </mrow>
        </mfrac>
        <mo>+</mo>
        <msub><mi>Y</mi><mi>n</mi></msub> 
    </mrow>
</math>
<P>With thanks to <a href="https://paulbourke.net/fractals/thorn/">Paul Bourke</a>.</P>
