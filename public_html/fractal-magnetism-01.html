<h1>Magnetism 01 Fractal</h1>
<p>The Magnetism 01 Fractal is generated using the following formula:</p>
<math display="block">
    <msup>
        <mrow>
            <msub><mrow><mi>Z</mi></mrow><mrow><mi>n</mi><mo>+</mo><mtext>1</mtext></mrow></msub> 
            <mo>=</mo> <mo>(</mo>
            <mfrac>
                <mrow><msup><mrow><mo>(</mo><msubsup><mi>Z</mi><mi>n</mi><mn>2</mn></msubsup><mo>+</mo><mi>C</mi><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mrow>

            </mfrac>
            <mo>+</mo>
            <mo>(</mo><mi>a</mi><mo>+</mo><mi>b<i>i</i></mi><mo>)</mo>
            <mo>)</mo>
        </mrow>
        <mrow>
            <mo>(</mo><mi>c</mi><mo>+</mo><mi>d<i>i</i></mi><mo>)</mo>
        </mrow>
    </msup>
