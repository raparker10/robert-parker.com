<h1>Complex Mark's Mandelbrot</h1>
<p>The Complex Mark's Mandelbrot is generated using the following equation:</p>
<math display="block">
    <mrow>
        <msub>
            <mrow><mi>Z</mi></mrow>
            <mrow><mi>n</mi><mo>+</mo><mtext>1</mtext></mrow>
        </msub> 
        <mo>=</mo> 
        <msubsup>
            <mrow><mi>Z</mi></mrow>
            <mi>n</mi>
            <mn>2</mn>
        </msubsup> 
        <msup>
            <mrow><mi>C</mi></mrow>
            <mrow><mo>(</mo><mi>a</mi><mo>+</mo><mi>b<i>i</i></mi><mo>)</mo><mo>-</mo><mn>1</mn></mrow>
        </msup> 
        <mo>+</mo><mi>C</mi><mo>+</mo><mo>(</mo><mi>c</mi><mo>+</mo><mi>d<i>i</i></mi><mo>)</mo>
    </mrow>
</math>
