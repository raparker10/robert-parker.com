<h1>Gray-Scott Reaction-Diffusion Model</h1>
<p>The Gray-Scott Reaction-Diffusion Model is generated with the following equation:</p>
<math display="block">
    <mrow>
        <msub><mrow><mi>a</mi></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub> 
        <mo>=</mo>
        <msub><mi>a</mi><mi>n</mi></msub>
        <mo>-</mo>
        <msub><mi>a</mi><mi>n</mi></msub>
        <msubsup><mi>b</mi><mi>n</mi><mn>2</mn></msubsup>
        <mo>+</mo>
        <mi>f</mi><mo>(</mo><mn>1</mn><mo>-</mo><msub><mi>a</mi><mi>n</mi></msub><mo>)</mo>
        <mo>+</mo>
        <msub><mi>D</mi><mi>a</mi></msub><mo>&nabla;</mo><msub><mi>a</mi><mi>n</mi></msub>
    </mrow>
</math>
<math display="block">
    <mrow>
        <msub><mrow><mi>b</mi></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub> 
        <mo>=</mo>
        <msub><mi>b</mi><mi>n</mi></msub>
        <mo>+</mo>
        <msub><mi>a</mi><mi>n</mi></msub>
        <msubsup><mi>b</mi><mi>n</mi><mn>2</mn></msubsup>
        <mo>+</mo>
        <mo>(</mo>
        <mi>f</mi>
        <mo>+</mo>
        <mi>k</mi>
        <mo>)</mo>
        <msub><mi>b</mi><mi>n</mi></msub>
        <mo>+</mo>
        <msub><mi>D</mi><mi>b</mi></msub><mo>&nabla;</mo><msub><mi>b</mi><mi>n</mi></msub>
    </mrow>
</math>
