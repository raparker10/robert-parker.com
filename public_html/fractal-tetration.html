<h1>Tetration Fractal</h1>
<p>The Tetration fractal is generated with the following equation:</p>
<math display="block">
    <mrow>
        <msub><mi>Z</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub> 
        <mo>=</mo> 
        <msup>
            <mi>C</mi>
            <mrow><msub><mi>Z</mi><mi>n</mi></msub><mo>(</mo><mi>a</mi><mo>+</mo><mi>b<i>i</i></mi><mo>)</mo></mrow>
        </msup>
    </mrow>
</math>

<div class="fractal-box">
