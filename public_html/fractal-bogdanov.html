<h1>Bogdanov Map</h1>
<p>The Bogdanov map is a 2-dimensional system described by the following equation:</p>
<math display="block">
    <mrow>
        <msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub>
        <mo>=</mo>
        <msub><mi>y</mi><mi>n</mi></msub>        
        <mo>+</mo>
        <mi>&#x3B5</mi><msub><mi>y</mi><mi>n</mi></msub>        
        <mo>+</mo>
        <mi>&#x3Ba</mi><msub><mi>x</mi><mi>n</mi></msub>        
        <mo>(</mo>
            <msub><mi>x</mi><mi>n</mi></msub><mo>-</mo><mn>1</mn>
        <mo>)</mo>
        <mo>+</mo>
        <mi>&#x3Bc</mi>
        <msub><mi>x</mi><mi>n</mi></msub>        
        <msub><mi>y</mi><mi>n</mi></msub>        
    </mrow>
</math>
<math display="block">
    <mrow>
        <msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub>
        <mo>=</mo>
        <msub><mi>x</mi><mi>n</mi></msub>        
        <mo>+</mo>
        <msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub>
    </mrow>
</math>
