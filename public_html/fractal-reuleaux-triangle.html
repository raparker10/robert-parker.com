<h1>Reuleaux Triangle</h1>
<p>The Reuleaux Triangle fractal is generated with the following equation:</p>
<math display="block">
    <mrow>
        <msub><mrow><mi>Z</mi></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub> 
        <mo>=</mo>
        <mfrac>
            <mrow><msubsup><mi>Z</mi><mi>n</mi><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mi>i</mi></mrow></msubsup><mo>+</mo><mfrac><mi>c</mi><mi>d</mi></mfrac><mo>+</mo><mi>e</mi><mi>i</mi></mrow>
            <msub><mi>Z</mi><mi>n</mi></msub>
        </mfrac>
    </mrow>
</math>
<P>With thanks to <a href="https://paulbourke.net/fractals/triangle/">Paul Bourke</a>.</P>
