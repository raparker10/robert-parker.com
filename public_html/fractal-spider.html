<h1>Spider</h1>
<p>The Spider fractal is generated with the following equation:</p>
<math display="block">
    <mrow>
        <msub><mrow><mi>Z</mi></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub> 
        <mo>=</mo>
        <msubsup><mi>Z</mi><mi>n</mi><mi>a</mi></msubsup> 
        <mo>+</mo>
        <mi>C</mi>
        <mo>+</mo>
        <mo>(</mo>
        <mi>c</mi>
        <mo>+</mo>
        <mi>d<i>i</i></mi>
        <mo>)</mo>
    </mrow>
</math>
<math display="block">
    <mrow>
        <msub><mrow><mi>C</mi></mrow><mrow><mi>n</mi><mo>+</mo><mtext>1</mtext></mrow></msub> 
        <mo>=</mo>
        <mfrac><mrow><msub><mi>C</mi><mi>n</mi></msub></mrow><mn>2</mn></mfrac>
        <msub><mi>Z</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub>
    </mrow>
</math>
