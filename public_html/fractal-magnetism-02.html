<h1>Magnetism 02 Fractal</h1>
<p>The Magnetism 02 Fractal is generated using the following formula:</p>
<math display="block">
        <mrow>
            <!-- Zn+1 --> <msub><mrow><mi>Z</mi></mrow><mrow><mi>n</mi><mo>+</mo><mtext>1</mtext></mrow></msub> 
            <mo>=</mo> <mo>(</mo>
            <msup>
                <mrow>
                    <msup>
                    <mfrac>
                        <mrow>
                            <mo>(</mo>
                                <msubsup><mi>Z</mi><mi>n</mi><mn>3</mn></msubsup>
                                <mo>+</mo><mn>3</mn><msub><mi>Z</mi><mi>n</mi></msub>
                                <mo>(</mo><mi>C</mi><mo>-</mo><mn>1</mn><mo>)</mo>
                                <mo>+</mo><mo>(</mo><mi>C</mi><mo>-</mo><mn>1</mn><mo>)</mo>
                                <mo>(</mo><mi>C</mi><mo>-</mo><mn>2</mn><mo>)</mo>
                            <mo>)</mo>
                        </mrow>
                        <mrow>
                            <msup>
                                <mrow>
                                    <mo>(</mo>
                                        <mn>3</mn><msubsup><mi>Z</mi><mi>n</mi><mn>2</mn></msubsup>
                                        <mo>+</mo><mn>3</mn><msub><mi>Z</mi><mi>n</mi></msub>
                                        <mo>(</mo><mi>C</mi><mo>-</mo><mn>1</mn><mo>)</mo>
                                        <mo>+</mo><mo>(</mo><mi>C</mi><mo>-</mo><mn>1</mn><mo>)</mo><mo>(</mo><mi>C</mi><mo>-</mo><mn>2</mn><mo>)</mo>
                                        <mo>+</mo><mn>1</mn>
                                    <mo>)</mo>
                                </mrow>
                                <mn>2</mn>
                            </msup>
                        </mrow>
                    </mfrac>
                    <mn>2</mn>
                    </msup>
                    <mo>)</mo>
                </mrow>
                <mrow>
                    <mo>(</mo><mi>a</mi><mo>+</mo><mi>b<i>i</i></mi><mo>)</mo>
                </mrow>
            </msup>
        </mrow>
        <mrow>
            <mo>+</mo><mo>(</mo><mi>c</mi><mo>+</mo><mi>d<i>i</i></mi><mo>)</mo>
        </mrow>
</math>
